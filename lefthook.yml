pre-commit:
  parallel: true
  commands:
    lint:
      glob: '*.{js,ts,jsx,tsx}'
      run: "npx eslint {staged_files} --rule 'prettier/prettier: 0'"
    types:
      glob: '*.{js,ts, jsx, tsx}'
      run: npx tsc
commit-msg:
  parallel: true
  commands:
    commitlint:
      run: npx commitlint --edit
